[package]
name = "terra-swarm"
version = "2.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terra_swarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cpal = "0.18.2"
rubato = "5.0.1"
reqwest = { version = "0.13.5", features = ["rustls", "stream"], default-features = false }
futures-util = "0.3.34"
whisper-rs = "0.16.0"
fontdb = "0.24.0"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
getrandom = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
